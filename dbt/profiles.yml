streamify:
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'STREAMIFY_TRANSFORMER') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'STREAMIFY') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'STREAMIFY_TRANSFORM_WH') }}"
      schema: STREAMIFY_STG
      threads: 4
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'STREAMIFY_TRANSFORMER') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'STREAMIFY') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'STREAMIFY_TRANSFORM_WH') }}"
      schema: STREAMIFY_PROD
      threads: 4
  target: dev
