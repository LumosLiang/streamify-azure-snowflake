[project]
name = "streamify-azure-snowflake"
version = "0.1.0"
description = "Kafka, Spark, ADLS Gen2 and Snowflake data pipelines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark==4.1.3",
    "kafka-python>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["spark_streaming"]
